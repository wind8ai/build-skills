# Deterministic demonstration only. These are not real model providers.
[providers.demo_a]
kind = "command"
command = ["python3", "{template_dir}/../../tests/fixtures/agent.py"]

[providers.demo_b]
kind = "command"
command = ["python3", "{template_dir}/../../tests/fixtures/agent.py"]

[roles]
prepare = "demo_a"
build = "demo_a"
evaluate = "demo_a"
improve = "demo_a"

[execution]
models = ["demo_a", "demo_b"]
repetitions = 1

[limits]
max_rounds = 3

# 0 disables the corresponding limit. Construction has no framework deadline.
[limits.build]
timeout_seconds = 0
max_calls = 0
total_seconds = 0

[limits.improve]
timeout_seconds = 0
max_calls = 0
total_seconds = 0

# Each execution model owns its own call/time budget.
[limits.execute]
timeout_seconds = 900
max_calls = 0
total_seconds = 0

[limits.prepare]
timeout_seconds = 600

[limits.evaluate]
timeout_seconds = 600

[quality]
minimum_score = 0.8
