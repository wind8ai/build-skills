[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "build-skills"
version = "0.1.0"
description = "Configurable workflows for refining and validating agent skills"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = ["typer>=0.16,<1", "pydantic>=2.10,<3", "jinja2>=3.1,<4", "pyyaml>=6,<7"]

[project.scripts]
build-skills = "build_skills.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "mypy>=1.15", "types-PyYAML>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/build_skills"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs/README.md", "/docs/cli.md", "/docs/intent.md", "/docs/design.md", "/docs/images", "/LICENSE", "/README.md", "/CONTRIBUTING.md", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
